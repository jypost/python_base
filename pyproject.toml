[tool.poetry]
name = "python-project-base"
version = "0.1.0"
description = "Python Project Base Template"
authors = ["jypark"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
websockets = "^16.0"
aiohttp = "^3.13.3"
python-dotenv = "^1.2.2"
pandas = "^3.0.1"
numpy = "^2.0"
loguru = "^0.7"
lxml = "^6.0.2"
openpyxl = "^3.1.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
